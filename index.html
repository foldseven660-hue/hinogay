<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tembak Air</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1 class="title">Water Gun Target!</h1>
        
        <div class="target-area" id="targetArea">
            <img src="assets/foto utama.jpg" alt="Foto Target" class="target-img" id="targetImg">
        </div>
        
        <button class="shoot-btn" id="shootBtn">
            <img src="assets/foto tembak.jpg" alt="Ikon Tembak" class="btn-icon">
            <span>TEMBAK!</span>
        </button>
    </div>

    <audio id="shootSound" src="assets/audio.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
